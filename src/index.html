<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0,
			user-scalable=no"
		/>
		<meta name="format-detection" content="telephone=no" />
		<meta name="msapplication-tap-highlight" content="no" />
		<!-- critical styles -->
		<style>
			body {
				background-image: linear-gradient(-180deg, rgba(255, 204, 0, .7) 12%, rgba(255, 204, 0, .5) 100%);
				height:100vh;
				position: relative;
			}
			body[data-js_state=loading]:before,
			body[data-js_state=loading]:after {
				content: "";
				position: absolute;
				left: 50%;
				top: 40vmin;
				transform: translate(-50%, -50%);
				color: #A5000A;
			}
			body[data-js_state=loading]:before {
				display: block;
				width: 30vmin;
				height: 30vmin;
				background: url(assets/cis-logo.png) 50% 50% / contain no-repeat;
			}
			body[data-js_state=loading]:after {
				top: 65vmin;
				display: block;
				height: 1rem;
				width: 50%;
				background: linear-gradient(to right, transparent, currentColor, transparent) 0 0 / 200% 100%;
				border-radius: .25rem;
				animation: 1.5s page-loading infinite ease-in-out;
			}
			body[data-js_state=loading] #root {
				display: none;
			}
			@keyframes page-loading{
				50% { background-position-x: 100%; }
			}
		</style>

		<link rel="icon" type="image/x-icon" href="./assets/icon/favicon.ico" />
		<link rel="manifest" href="./manifest.json" />
		<script src="./index.tsx" type="module"></script>
	</head>
	<body data-js_state="loading">
		<div id="root"></div>
	</body>
</html>
